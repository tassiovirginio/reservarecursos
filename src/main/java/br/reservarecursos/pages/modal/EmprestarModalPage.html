<wicket:panel xmlns:wicket="http://wicket.apache.org">
    <nav class="navbar navbar-inverse">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand" href="#">Emprestimo de Recurso</a>
            </div>
        </div>
    </nav>
    <br><br><br>

    <form wicket:id="form">
        Usuário: <select wicket:id="usuario"></select><br>
        Senha: <input wicket:id="senha" type="password" /><br>
        Recurso: <label wicket:id="nome" ></label><br>
        Data/Hora: <label wicket:id="data"></label><br>
        <center>
        <input class="btn btn-success btn-xs" wicket:id="save" type="submit" value="Emprestar" />
        </center>
    </form>
</wicket:panel>
