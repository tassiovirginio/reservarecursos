#DB para Testes
db.teste=true

#WS-REST
rest.ligar=false

#Configuração do Email
email.host=smtp.gmail.com
email.port=587
email.username=email@email.com.br
email.password=senha

#Configuração do LDAP
ldap.ligado=false
ldap.atualizacao_automatica=false
ldap.url=ldap://0.0.0.0:389
ldap.base=ou=NONE,ou=NONE,dc=NONE,dc=NONE
ldap.username=cn=admin,cn=users,dc=none,dc=local
ldap.password=password

# connect data (SQLite)
jdbc.driver=org.sqlite.JDBC
#jdbc:sqlite::memory
jdbc.url=jdbc:sqlite:recursos.db
hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

jdbc.username=
jdbc.password=

# Desligado para não poluir o console; volte para true para depurar as queries.
hibernate.show_sql=false
hibernate.hbm2ddl.auto=update

